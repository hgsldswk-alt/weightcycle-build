name: WeightCycle
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.weightcycle
    APP_STORE_ID: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  WeightCycle:
    type: application
    platform: iOS
    sources: [WeightCycle, Shared]
    dependencies:
      - target: WeightCycleWidget
        embed: true
      - sdk: HealthKit.framework
    entitlements:
      path: WeightCycle/WeightCycle.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups: [group.com.hgsldswk.weightcycle]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: WeightCycle AppStore
    info:
      path: WeightCycle/Info.plist
      properties:
        CFBundleDisplayName: Weight & Cycle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        NSHealthShareUsageDescription: Read weight and menstrual flow records you choose, to show them together on this iPhone.
        CFBundleURLTypes:
          - CFBundleURLName: com.hgsldswk.weightcycle
            CFBundleURLSchemes: [weightcycle]
  WeightCycleWidget:
    type: app-extension
    platform: iOS
    sources:
      - WeightCycleWidget
      - Shared/L10n.swift
      - Shared/Resources
      - Shared/Theme.swift
      - Shared/WidgetSnapshot.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: WeightCycle Widget AppStore
    entitlements:
      path: WeightCycleWidget/WeightCycleWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.weightcycle]
    info:
      path: WeightCycleWidget/Info.plist
      properties:
        CFBundleDisplayName: Weight & Cycle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  WeightCycleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WeightCycleTests
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  WeightCycleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WeightCycleUITests]
    dependencies:
      - target: WeightCycle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WeightCycle
schemes:
  WeightCycle:
    build:
      targets:
        WeightCycle: all
        WeightCycleTests: [test]
    test:
      config: Debug
      targets: [WeightCycleTests]
  WeightCycleUI:
    build:
      targets:
        WeightCycle: all
        WeightCycleUITests: [test]
    test:
      config: Debug
      targets: [WeightCycleUITests]
